document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=e.target.querySelector('button');
  btn.textContent='Decrypting…';btn.disabled=true;
  try{
    const plain=await decrypt(document.getElementById('pw').value,SALT,IV,CT);
    document.open();document.write(plain);document.close();
  }catch{
    document.getElementById('err').textContent='Incorrect password.';
    btn.textContent='View case study';btn.disabled=false;
  }
});
async function decrypt(pw,saltB64,ivB64,ctB64){
  const s=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
  const pwKey=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:s(saltB64),iterations:100000,hash:'SHA-256'},
    pwKey,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:s(ivB64)},key,s(ctB64));
  return new TextDecoder().decode(buf);
}
